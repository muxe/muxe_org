name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the server host key (no blind TOFU).
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          # Pack the built app + package.json + migrations and stream it to
          # the server's forced deploy command over stdin. The server's
          # authorized_keys pins command="deploy.sh", so whatever we send here
          # is ignored — only the tarball on stdin matters. db/ carries the
          # dbmate migrations that deploy.sh applies before restart.
          tar czf - dist package.json db \
            | ssh -i ~/.ssh/deploy_key \
                  -o UserKnownHostsFile=~/.ssh/known_hosts \
                  -o StrictHostKeyChecking=yes \
                  "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                  "deploy"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
